services:
  postgres:
    container_name: ecom_postgres
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    networks:
      - ecom-network
    healthcheck:
      #real query, not pg_isready: PQping reports the server up without opening
      #the database, so it goes green while init-db.sql is still running.
      #order_db is the last statement in init-db.sql, so it's the strictest signal
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${ORDER_DB} -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-server:
    container_name: ecom_redis
    image: redis:8
    ports:
      #loopback only. Redis here has no requirepass, and an open unauthenticated Redis
      #is not just a data leak: CONFIG SET dir/dbfilename lets an attacker write
      #arbitrary files as the redis user. Plain "6379:6379" binds 0.0.0.0 and hands
      #that to the whole LAN. The gateway does not need this mapping at all - it
      #reaches redis-server:6379 over ecom-network - so it exists only for redis-cli
      #and RedisInsight from the host. Same rule as 7073 and 9093.

      - "127.0.0.1:6379:6379"

    #no persistence: the only thing stored is rate-limiter token buckets
    #(request_rate_limiter.{key}.tokens), which are per-second state that SHOULD be
    #empty after a restart. The image default is "save 3600 1 300 100 60 10000" with
    #stop-writes-on-bgsave-error yes, and that default is a trap here: if a snapshot
    #ever fails, Redis refuses all writes with MISCONF, the limiter's Lua script errors,
    #and RedisRateLimiter fails OPEN - the same silent no-limiting symptom as a wrong
    #host. Turning persistence off removes the failure mode instead of monitoring it.

    command: ["redis-server", "--save", "", "--appendonly", "no"]

    #no volumes, deliberately. redis_data:/data/redis_db persisted nothing - redis
    #writes dump.rdb to /data (its WORKDIR), so that mount only created an empty
    #root-owned directory. redis_data:/data/dump.rdb is worse: a named volume always
    #mounts as a DIRECTORY, so dump.rdb becomes a directory, the snapshot rename fails
    #with EISDIR, and stop-writes-on-bgsave-error trips the MISCONF case above.
    #This image declares no VOLUME, so with persistence off nothing is written and no
    #anonymous volume appears either.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ecom-network
    restart: unless-stopped

  mongodb:
    container_name: ecom_mongodb
    image: mongodb/mongodb-community-server:8.0-ubi8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - ecom-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  #kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecom_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      #Kraft
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      #Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      #Storage(same as in volumes)
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      #cluster metadata
      CLUSTER_ID: "mBrNMiZzQ7ihee_MZJ7FcQ"
      #Broker Settings(for 1 broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # was KAFKA_GROUP_INITIAL_REBLANCE_DELAY_MS - "REBLANCE". Unknown KAFKA_* variables
      # are not an error: the image's configure script only translates names it knows, so
      # a misspelling is dropped and the broker starts with the 3s default. Only matters
      # for how fast a single-broker dev group forms, but it is the same silent-typo
      # failure mode as the healthcheck below and the binding name in details.md §22.3.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # kafka-broker-api-versions, with a HYPHEN. It was kafka_broker-api-versions, which
      # exits 126 "executable file not found in $PATH" on every probe - so the container
      # ran perfectly ("Kafka Server started" in the logs, both listeners accepting) but
      # never turned healthy, and every service with depends_on: condition: service_healthy
      # sat waiting on it. A broken healthcheck looks exactly like a broken service.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Without this, Compose puts kafka on the implicit default network while every other
    # service is on ecom-network, so "kafka" does not resolve from order/notification.
    # The symptom is not a DNS error but
    # "ConfigException: No resolvable bootstrap urls given in bootstrap.servers",
    # wrapped in "Failed to create new KafkaAdminClient" and then in a Stream
    # BinderException - three layers away from the actual cause.
    networks:
      - ecom-network
    restart: unless-stopped



  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672" #AMQP
      - "${RABBITMQ_MGMT_PORT}:15672" #Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecom-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  #config server
  config-server:
    build:
      context: ./configserver
    container_name: ecom_config_server
    ports:
      - "${CONFIG_PORT}:8888"
    volumes:
      - ./configserver/src/main/resources/config:/app/config:ro
      - ./logs/config-server:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  #cloud-gateway
  cloud-gateway:
    build:
      context: ./gateway
    container_name: ecom_gateway
    ports:
      - "${GATEWAY_PORT}:8080"
      #actuator, bound to loopback only. Without the 127.0.0.1 prefix Docker binds
      #0.0.0.0, exposing /actuator/heapdump (the whole JVM heap, credentials included)
      #and /actuator/env to anything on the LAN. See details.md §16.2.
      #7073, not 8083: 8083 is already order-service's application port inside the
      #network, and reusing it on the host made "8083" mean two different services.
      - "127.0.0.1:7073:9090"
    volumes:
      - ./logs/cloud-gateway:/app/logs
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
    networks:
      - ecom-network
    healthcheck:
      #liveness, not /actuator/health: register-health-indicator is on for the gateway
      #breakers, so an OPEN breaker makes /actuator/health report DOWN and return 503,
      #which would fail `curl -f` and mark the container unhealthy for a downstream
      #outage the gateway is handling correctly. The liveness group is livenessState only.
      test: [ "CMD", "curl", "-f", "http://localhost:9090/actuator/health/liveness" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped


  # Product service
  product-service:
    build:
      context: ./product

    container_name: ecom_product

    #no ports: reachable only through the gateway and inside ecom-network
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PRODUCT_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}

    volumes:
      - ./logs/product-service:/app/logs
    networks:
      - ecom-network
    restart: unless-stopped

  # User service
  user-service:
    build:
      context: ./user

    container_name: ecom_user

    #no ports: reachable only through the gateway and inside ecom-network
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${USER_DB}?authSource=admin
      TEST_VAR: hello_from_docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
    volumes:
      - ./logs/user-service:/app/logs
    networks:
      - ecom-network
    restart: unless-stopped

  # Order service
  order-service:
    build:
      context: ./order
    ports:
      #actuator only, loopback-bound - see the note on cloud-gateway above.
      #The API itself stays unpublished: reachable only through the gateway.
      - "127.0.0.1:9093:9090"
    container_name: ecom_order

    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      # Overrides the localhost:29092 default in config/order-service.yml. Inside a
      # container localhost is the container itself; kafka:9092 is the PLAINTEXT
      # listener advertised on this network.
      KAFKA_BROKERS: kafka:9092
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
    volumes:
      - ./logs/order-service:/app/logs
    networks:
      - ecom-network

    restart: unless-stopped

  #notification service
  notification-service:
    build:
      context: ./notification
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT}:8084"
    container_name: ecom_notification
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      # Overrides the localhost:29092 default in config/notification-service.yml.
      KAFKA_BROKERS: kafka:9092
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
    volumes:
      - ./logs/notification-service:/app/logs
    networks:
      - ecom-network
    restart: unless-stopped


  # eureka server
  eureka-server:
    build:
      context: ./eureka
    container_name: ecom_eureka_server
    ports:
      - "${EUREKA_SERVER_PORT}:8761"

    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
    volumes:
      - ./logs/eureka-server:/app/logs
    networks:
      - ecom-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ecom-network
    restart: unless-stopped

