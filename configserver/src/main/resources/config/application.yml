management:
  #actuator on its own port, deliberately not published in docker-compose.yml
  #so endpoints (incl. shutdown) are reachable inside ecom-network only
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: "*"
  #eureka deregistering gracefully
  endpoint:
    shutdown:
      enabled: true
  #zipkin
  tracing:
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
    sampling:
      probability: 1.0


eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7