
server:
  port: 8084

spring:
  cloud:
    #Names the java.util.function.Consumer bean to bind. The bean is
    #OrderEventConsumer.orderCreated(), so the binding names Stream derives are
    #orderCreated-in-0 (input) and orderCreated-out-0 (output, unused here).
    #
    #Only spring.cloud.function.definition is correct. spring.cloud.stream.function
    #.definition was the Spring Cloud Stream 3.x spelling and is gone in 4.x/2025.x -
    #it binds to nothing and is ignored in silence, so it was removed rather than kept
    #"just in case". With exactly one function bean on the classpath this property is
    #strictly optional, but being explicit means adding a second Consumer later fails
    #loudly instead of picking one at random.
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          #With the Kafka binder this is a TOPIC name, not an exchange. "order.exchange"
          #is a legal Kafka topic - the allowed characters are [a-zA-Z0-9._-] - but it is
          #a leftover name from the AMQP version and should be renamed (order.created)
          #once both sides move together. Kafka also warns about topic names mixing "."
          #and "_", because it collapses both to "_" in metric names, so two topics can
          #silently share one metric.
          destination: order.exchange
          content-type: application/json
          #group belongs on the BINDING, not on the binder - it briefly sat under
          #kafka.binder, where no such property exists, so it was accepted and ignored.
          #It is also binder-INDEPENDENT: this line is unchanged from the RabbitMQ
          #version, and it is what §22.4 was about.
          #
          #What it means does change underneath. On Rabbit it produced a durable queue
          #order.exchange.notification. On Kafka it is the native CONSUMER GROUP: the
          #broker tracks this group's committed offset per partition, so a restart
          #resumes where it left off, and a second instance in the same group is given
          #a share of the partitions rather than a copy of the messages.
          #
          #Without it Stream invents an anonymous group and sets startOffset to latest,
          #so a restart silently skips everything published while the service was down -
          #the same class of message loss as the anonymous auto-delete queue on Rabbit,
          #reached by a completely different mechanism.
          group: notification
      kafka:
        binder:
          #Connection only. localhost:29092 is the HOST-side address, matching the
          #PLAINTEXT_HOST advertised listener, so running this service from the IDE
          #works with no extra config. Inside a container localhost is the container
          #itself, so docker-compose.yml overrides this with KAFKA_BROKERS=kafka:9092,
          #the PLAINTEXT listener advertised on the compose network.
          #
          #Getting this wrong does not look like a connection error. The AdminClient
          #just never reaches a broker and the binding fails as
          #"ProvisioningException: Provisioning exception encountered for order.exchange
          #... Caused by: TimeoutException", which reads like a topic problem.
          brokers: ${KAFKA_BROKERS:localhost:29092}