server:
  port: 8080

#RedisRateLimiter talks to Redis through the ReactiveStringRedisTemplate that
#spring-boot-starter-data-redis-reactive auto-configures. Its default host is
#localhost, which inside the gateway CONTAINER means the gateway itself - so every
#rate-limit check failed with "Connection refused: localhost/127.0.0.1:6379".
#
#That failure is silent by design: RedisRateLimiter.isAllowed puts an onErrorResume
#on the Lua call which logs "Error calling rate limiter lua" and returns [1, -1],
#i.e. ALLOWED. The limiter fails OPEN, so a broken Redis connection looks exactly
#like a rate limiter that is switched off. Grep the gateway log for that message
#whenever limiting stops working.
#
#redis-server is the compose service name, resolved by Docker's DNS on ecom-network.
spring:
  data:
    redis:
      host: redis-server
      port: 6379
      #the Lua script is one round trip per request and sits on the hot path; a
      #hung connect must not stall the reactor thread longer than a request.
      timeout: 2s
      connect-timeout: 2s
  #Keycloak as the JWT issuer. The gateway is a RESOURCE SERVER only: it validates
  #bearer tokens, it never redirects anyone to a login page. That is why the
  #dependency is spring-boot-starter-security-oauth2-resource-server and not
  #...-oauth2-client (note the Boot 4 name: Boot 3 called it
  #spring-boot-starter-oauth2-resource-server, without the "security-").
  #
  #These two properties look redundant and are not. They answer different questions:
  #
  #  issuer-uri  = the string that must EQUAL the token's "iss" claim.
  #  jwk-set-uri = the URL the gateway actually CONNECTS to for signing keys.
  #
  #They have to differ here because the token and the validator see Keycloak from
  #different networks. A token is fetched from a browser/Postman on the HOST, so
  #Keycloak stamps iss=http://localhost:8443/realms/ecom-app. But inside the gateway
  #CONTAINER "localhost" is the gateway itself - the same trap as the Redis host
  #above and KAFKA_BROKERS in order-service.yml - so that URL is unreachable for
  #fetching keys. keycloak:8080 is the compose service name and the container port
  #(8443 is only the HOST-side publish).
  #
  #Setting both is what makes this work rather than a hack: when jwk-set-uri is
  #present Boot builds the decoder from it directly and never calls the discovery
  #endpoint, then applies JwtValidators.createDefaultWithIssuer(issuer-uri) on top.
  #So keys come from the reachable URL and the iss claim is still checked strictly.
  #Drop issuer-uri and the iss claim stops being validated at all - a token from any
  #realm signed by these keys would be accepted.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8443/realms/ecom-app
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8443/realms/ecom-app/protocol/openid-connect/certs}

management:
  endpoint:
    #route-listing endpoint is disabled by default; exposure ("*" in the shared
    #config) is a separate switch from enablement. "gateway" here is the fixed
    #actuator endpoint id, not the service name.
    gateway:
      access: read-only

    health:
      show-details: always
      #Adds /actuator/health/liveness and /actuator/health/readiness. The compose
      #healthcheck points at liveness rather than at /actuator/health, because
      #register-health-indicator below makes an OPEN breaker turn /actuator/health
      #DOWN -> HTTP 503 -> `curl -f` fails -> the container is marked unhealthy.
      #The liveness group contains only livenessState, so tripping a breaker can no
      #longer make Docker think the gateway itself is broken.
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

#Top level, NOT under management. resilience4j's properties are bound from
#"resilience4j.circuitbreaker.*"; nested under management they bind to nothing at all,
#silently, and every breaker falls back to CircuitBreakerConfig.ofDefaults()
#(minimum-number-of-calls 100, registerHealthIndicator false) - which looks exactly
#like the circuit breaker "not working".
#
#Unlike order-service, the gateway has no @CircuitBreaker annotations: the breakers are
#applied by the route filters in GatewayConfig, through the programmatic
#ReactiveCircuitBreaker API. That needs no aspect, so the gateway needs no
#spring-boot-starter-aspectj.
#
#The instance keys must equal the ids passed to .setName(...) in GatewayConfig.
#A name with no matching key here is not an error - resilience4j quietly uses
#configs.default - so a typo shows up as wrong settings, not as a startup failure.
#Declaring them here also makes them EAGER: resilience4j-spring-boot3 walks
#instances: at startup and registers each one, so they appear in
#/actuator/circuitbreakers before any traffic. Without a declaration the gateway
#filter registers its breaker lazily, on the first request through that route.
resilience4j:
  circuitbreaker:
    configs:
      default:
        # count-based: with low traffic a time-based window is usually empty, so rates
        # never get computed and the breaker never opens
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # resilience4j's own default is 100, which means the breaker would never open in
        # a demo. 5 makes it observable.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # without this, OPEN -> HALF_OPEN only happens when a call arrives after the wait
        # duration; with it a scheduler does the transition, so it is visible in actuator
        # even with no traffic
        automatic-transition-from-open-to-half-open-enabled: true
        # Records a slow call as a failure. Must stay BELOW the timelimiter timeout
        # below, otherwise the timeout aborts the call first and it is recorded as a
        # plain failure instead of a slow one.
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        # publishes breaker state into /actuator/health as a "circuitBreakers" entry.
        # It does NOT make the endpoint report DOWN when a breaker opens: OPEN maps to
        # the custom status CIRCUIT_OPEN, which is absent from Status.DEFAULT_ORDER, so
        # SimpleStatusAggregator filters it out and the aggregate stays UP / HTTP 200.
        # The switch that would make an OPEN breaker return 503 - and so fail a
        # `curl -f` container healthcheck - is allow-health-indicator-to-fail: true,
        # which is deliberately not set. The compose healthcheck targets
        # /actuator/health/liveness anyway, so turning it on later stays safe.
        register-health-indicator: true
        # No ignore-exceptions here. The gateway is a reverse proxy: a downstream 404
        # comes back as an ordinary HTTP response, not as an exception, so it is already
        # recorded as a SUCCESS and cannot push the breaker open. HttpClientErrorException
        # is a RestClient/RestTemplate type and is never thrown on this path.
        # To make downstream status codes count as failures, add
        # .setStatusCodes(...) to the route filter instead.
    instances:
      # one breaker per downstream service. not Sharing a single id across all three routes
      productServiceCB:
        base-config: default
      userServiceCB:
        base-config: default
      orderServiceCB:
        base-config: default

  # The reactive path DOES apply a TimeLimiter, unlike the @CircuitBreaker annotation
  # order-service: ReactiveResilience4JCircuitBreaker.run() wraps the chain in
  # Mono.timeout(timeLimiterConfig.getTimeoutDuration()). The default is 1 SECOND,
  # names must match the circuitbreaker instance names.
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
    instances:
      productServiceCB:
        base-config: default
      userServiceCB:
        base-config: default
      orderServiceCB:
        base-config: default


#No keycloak.admin block here. The gateway is a RESOURCE SERVER: it validates tokens and
#never calls the Keycloak Admin API, so admin credentials would be an unused secret in
#the one internet-facing service. They live in user-service.yml, which is the only
#service that provisions users.

