
server:
  port: 8083

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  #Only the timeout lives here. Host, port, username and password come from
  #docker-compose environment variables (SPRING_RABBITMQ_*), because they include the
  #password - see details.md §21.1.
  #
  #The client default is 60 SECONDS. That never mattered while the publish sat on the
  #request thread and blew up the transaction anyway, but now that OrderEventPublisher
  #is @Async it decides how long a task-executor thread is parked when the broker is
  #down. With Boot's default pool that is a slow path to exhausting the pool and
  #queueing every subsequent publish behind it. Measured at 3.7s with the container
  #stopped; 2s caps it below that and well below the gateway's 5s TimeLimiter.
  rabbitmq:
    connection-timeout: 2s
app:
  order:
    message: "hello-order-v2"

#Circuit breakers for the two services order-service calls out to.
#
#Everything is configured here rather than in Java. The @CircuitBreaker annotations on
#ProductLookup.getProduct and UserLookup.getUser carry only a name; that name is looked up
#against the instances: block below. A name with no matching instance is NOT an error -
#resilience4j falls back to configs.default - so a typo shows up as a breaker that quietly
#uses the wrong settings rather than as a startup failure.
#
#Because this file is served by the config server, these values can be changed and pushed
#with the /actuator/busrefresh bus without rebuilding the image.
#
#The actuator endpoints need no config. They are declared @Endpoint(id="circuitbreakers")
#and @Endpoint(id="circuitbreakerevents") with no enableByDefault=false, so unlike the
#gateway's routes endpoint they are on by default and the exposure include:"*" in the
#shared application.yml is already enough to reach them.
resilience4j:
  circuitbreaker:
    configs:
      default:
        # count-based: with low traffic a time-based window is usually empty, so rates
        # never get computed and the breaker never opens
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # resilience4j's own default is 100, which means the breaker would never open in
        # a demo. 5 makes it observable.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # without this, OPEN -> HALF_OPEN only happens when a call arrives after the wait
        # duration; with it a scheduler does the transition, so it is visible in actuator
        # even with no traffic
        automatic-transition-from-open-to-half-open-enabled: true
        # The annotation applies no TimeLimiter, unlike CircuitBreakerFactory.run() which
        # wrapped every call in a 1-second one. These two are the annotation-era
        # replacement: a call slower than the threshold is recorded as a failure and can
        # open the breaker. Note it records, it does not abort - the caller still waits.
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 50
        # publishes breaker state into /actuator/health as a "circuitBreakers" entry.
        # An OPEN breaker does NOT turn the endpoint DOWN: OPEN maps to the custom status
        # CIRCUIT_OPEN, which SimpleStatusAggregator drops because it is not in
        # Status.DEFAULT_ORDER, so the aggregate stays UP. allow-health-indicator-to-fail:
        # true is what would make it a real DOWN / HTTP 503 - not set, here or in
        # cloud-gateway.yml.
        register-health-indicator: true
        # a 404 means "no such product/user", not "the service is broken", so it must not
        # push the breaker towards OPEN. Ignored exceptions are recorded as neither
        # success nor failure - and they still propagate, so the fallback methods in
        # ProductLookup/UserLookup still turn them into the usual 404 responses.
        # $ is the nested-class separator: NotFound is an inner class of
        # HttpClientErrorException.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
    instances:
      product-service:
        base-config: default
      user-service:
        base-config: default

rabbitmq:
  exchange:
    name: order.exchange
  queue:
    name: order.queue
  routing:
    key: order.tracking