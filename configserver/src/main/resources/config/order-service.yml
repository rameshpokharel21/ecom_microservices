
server:
  port: 8083

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    stream:
      bindings:
        publishOrderCreated-out-0:
          destination: order.exchange
          content-type: application/json
      kafka:
        binder:
          #See config/notification-service.yml for the full note. localhost:29092 is the
          #host-side listener for IDE runs; docker-compose.yml overrides it with
          #KAFKA_BROKERS=kafka:9092 for the compose network.
          brokers: ${KAFKA_BROKERS:localhost:29092}

#The Rabbit producer block below has no Kafka equivalent and is kept only as a marker of
#what did NOT port. A topic exchange routes on a key with wildcards; Kafka has no routing
#layer at all - the nearest concept is partition-key-expression, which chooses a PARTITION
#within one topic and so controls ordering and consumer assignment, not delivery. Filtering
#by event type has to move into the payload, into headers, or into separate topics.
#      rabbit:
#        bindings:
#          publishOrderCreated-out-0:
#            producer:
#              routing-key-expression: '''order.tracking'''

  #The spring.rabbitmq.connection-timeout that used to sit here is gone with the broker.
  #It had already been dead for two sections: §23 moved this service to the Kafka binder
  #and dropped every AMQP dependency, so the property bound to nothing. Unknown config
  #keys are not an error, which is exactly why it survived unnoticed.
  #
  #There is no direct Kafka equivalent. The concern it addressed - an @Async publish
  #thread parked on an unreachable broker - is covered on this binder by the producer's
  #max.block.ms (60s by default), which is worth revisiting if that ever bites.

  #Timeouts for the outbound @HttpExchange clients. Boot's default is NO timeout, and
  #@CircuitBreaker does not add one - slow-call-duration-threshold only RECORDS a slow
  #call, it never aborts it, so before this a hung product-service parked the request
  #thread forever. Read 5s sits above the 4s slow-call threshold (so slow calls are still
  #classed slow rather than aborted first) and no higher than the gateway's 5s
  #TimeLimiter, which has already given up by then. Note spring.http.client.* is
  #deprecated since Boot 4.0.0 - the current prefix is spring.http.clientS.
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
app:
  order:
    message: "hello-order-v2"

#Circuit breakers for the two services order-service calls out to.
#
#Everything is configured here rather than in Java. The @CircuitBreaker annotations on
#ProductLookup.getProduct and UserLookup.getUser carry only a name; that name is looked up
#against the instances: block below. A name with no matching instance is NOT an error -
#resilience4j falls back to configs.default - so a typo shows up as a breaker that quietly
#uses the wrong settings rather than as a startup failure.
#
#Because this file is served by the config server, these values can be changed and pushed
#with the /actuator/busrefresh bus without rebuilding the image.
#
#The actuator endpoints need no config. They are declared @Endpoint(id="circuitbreakers")
#and @Endpoint(id="circuitbreakerevents") with no enableByDefault=false, so unlike the
#gateway's routes endpoint they are on by default and the exposure include:"*" in the
#shared application.yml is already enough to reach them.
resilience4j:
  circuitbreaker:
    configs:
      default:
        # count-based: with low traffic a time-based window is usually empty, so rates
        # never get computed and the breaker never opens
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # resilience4j's own default is 100, which means the breaker would never open in
        # a demo. 5 makes it observable.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # without this, OPEN -> HALF_OPEN only happens when a call arrives after the wait
        # duration; with it a scheduler does the transition, so it is visible in actuator
        # even with no traffic
        automatic-transition-from-open-to-half-open-enabled: true
        # The annotation applies no TimeLimiter, unlike CircuitBreakerFactory.run() which
        # wrapped every call in a 1-second one. These two are the annotation-era
        # replacement: a call slower than the threshold is recorded as a failure and can
        # open the breaker. Note it records, it does not abort - the caller still waits.
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 50
        # publishes breaker state into /actuator/health as a "circuitBreakers" entry.
        # An OPEN breaker does NOT turn the endpoint DOWN: OPEN maps to the custom status
        # CIRCUIT_OPEN, which SimpleStatusAggregator drops because it is not in
        # Status.DEFAULT_ORDER, so the aggregate stays UP. allow-health-indicator-to-fail:
        # true is what would make it a real DOWN / HTTP 503 - not set, here or in
        # cloud-gateway.yml.
        register-health-indicator: true
        # a 404 means "no such product/user", not "the service is broken", so it must not
        # push the breaker towards OPEN. Ignored exceptions are recorded as neither
        # success nor failure - and they still propagate, so the fallback methods in
        # ProductLookup/UserLookup still turn them into the usual 404 responses.
        # $ is the nested-class separator: NotFound is an inner class of
        # HttpClientErrorException.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
    instances:
      product-service:
        base-config: default
      user-service:
        base-config: default

#The rabbitmq.exchange.name / queue.name / routing.key block that used to live here is
#gone with RabbitMQConfig, which was its only consumer once OrderEventPublisher moved to
#StreamBridge. The exchange is now spring.cloud.stream.bindings...destination above, and
#the routing key is the routing-key-expression beside it.